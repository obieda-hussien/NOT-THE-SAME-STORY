name: Godot validation and Android debug APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2-stable'
  GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

jobs:
  logic:
    name: Validate source and run Godot tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authored case and localization
        run: python tests/verify_source.py
      - name: Download pinned editor
        run: |
          curl -fLsS --retry 4 --retry-all-errors -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
      - name: Import project and validate script parsing
        run: "$GODOT_BIN" --headless --path . --editor --quit
      - name: Execute deterministic core tests
        run: "$GODOT_BIN" --headless --path . --script tests/core_tests.gd
      - name: Smoke-test startup without a display
        run: "$GODOT_BIN" --headless --path . --quit-after 20

  android:
    name: Export installable Android debug APK
    needs: logic
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
      - name: Install pinned Godot editor and Android export templates
        run: |
          curl -fLsS --retry 4 --retry-all-errors -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          curl -fLsS --retry 4 --retry-all-errors -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          unzip -p templates.tpz templates/android_release.apk > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
          printf '%s\n' '4.7.2.stable' > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
      - name: Configure Godot Java and Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF
      - name: Import and export debug APK
        run: |
          "$GODOT_BIN" --headless --path . --editor --quit
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug Android build/not-the-same-story-debug.apk
          test -s build/not-the-same-story-debug.apk
          unzip -t build/not-the-same-story-debug.apk | tail -1
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: not-the-same-story-debug-${{ github.sha }}
          path: build/not-the-same-story-debug.apk
          if-no-files-found: error
          retention-days: 14
